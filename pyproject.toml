[project]
name = "histological-cancer-analysis"
version = "0.1.0"
description = "Binary classifier for detecting metastatic cancer in histopathology image patches."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.0.0",
    "fire>=0.7.0",
    "gdown>=5.2.0",
    "hydra-core>=1.3.2",
    "matplotlib>=3.8.0",
    "mlflow>=3.13.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pytorch-lightning>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchmetrics>=1.0.0",
    "torchvision>=0.15.0",
]

[project.scripts]
hca = "histological_cancer_analysis.commands:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 95
format = { docstring-code-format = true }

[tool.ruff.lint]
select = [
    # isort
    "I",
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-builtins
    "A",
    # flake8-return
    "RET",
    # flake8-use-pathlib
    "PTH",
    # flynt
    "FLY",
    # mccabe
    "C90",
    # NumPy-specific rules
    "NPY",
    # pep8-naming
    "N",
    # Ruff-specific rules
    "RUF",
    # Pylint - very strict, may be use when have enough time
    # "PL",
    # refurb - also may be overwhelming
    "FURB",
]

pycodestyle = { max-doc-length = 105 }
