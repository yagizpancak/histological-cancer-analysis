[project]
name = "histological-cancer-analysis"
version = "0.1.0"
description = "Binary classifier for detecting metastatic cancer in histopathology image patches."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "fire>=0.7.1",
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.9",
    "mlflow>=3.13.0",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "pytorch-lightning>=2.6.5",
    "scikit-learn>=1.9.0",
    "torch>=2.12.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.27.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
